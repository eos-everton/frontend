<div class="login-container">
  <h2>Login</h2>
  <form (ngSubmit)="login()">
    <div class="div-form">
      <div class="input-form">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          required
        />
      </div>
      <div class="input-form">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>
      <div class="btn">
        <button type="submit">Login</button>
        <button (click)="register()">Registrar</button>
      </div>
    </div>
  </form>
</div>
